<!doctype html>
<html lang="en" data-density="demo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faucet · Skim Clearing devnet</title>
<link rel="icon" href="/schematic/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/schematic/styles.css">
<style>
  .ds-shell { width: min(100%, 720px); }
  .stack > * + * { margin-top: var(--space-4); }
  .out { min-height: 22px; font-size: 13px; }
  .out.ok { color: var(--ok); } .out.bad { color: var(--fail); }
  .note { margin: 0; color: var(--muted); font-size: var(--fs-small); line-height: 1.6; }
</style>
</head>
<body>
<div class="ds-shell">
  <header class="ds-header">
    <a class="ds-wordmark" href="/">skim clearing <span class="ds-wordmark-sub">devnet</span></a>
    <nav><a href="/">← Back to the app</a><a href="/faucet" aria-current="page">Faucet</a></nav>
  </header>
  <div class="ds-page-header">
    <div>
      <p class="ds-eyebrow" id="net">—</p>
      <h1>Faucet</h1>
      <p class="ds-page-description" id="what">—</p>
    </div>
  </div>
  <div class="ds-panel">
    <div class="ds-panel-head"><h2>Send test funds</h2><span class="ds-meta" id="amounts">—</span></div>
    <div class="ds-panel-body stack">
      <div class="ds-field">
        <label class="ds-label" for="addr">Your address</label>
        <input class="ds-input ds-mono" id="addr" placeholder="0x…" autocomplete="off" spellcheck="false">
      </div>
      <div class="ds-actions">
        <button class="ds-button ds-button--primary" id="go">Send test funds</button>
        <button class="ds-button" id="useWallet">Use my wallet's address</button>
      </div>
      <div class="out" id="out" role="status"></div>
      <p class="note">Then go back to the app and deposit: funds in your wallet are not trading balance until they're in the channel.</p>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let amounts = "";
  fetch("/api/config").then((r) => r.json()).then((cfg) => {
    const eth = Number(cfg.faucet.eth) / 1e18, usd = (Number(cfg.faucet.usd) / 1e6).toLocaleString("en-US").replace(/,/g, " ");
    amounts = `${eth} ETH and ${usd} USD`;
    $("net").textContent = `${cfg.l1.name} · chain ${cfg.l1.chainId}`;
    $("amounts").textContent = `${eth} ETH · ${usd} USD`;
    $("go").textContent = `Send ${amounts}`;
    $("what").textContent = cfg.network === "sepolia"
      ? `Sends ${amounts} (a test token) on Sepolia, where you deposit into the session's escrow. The ETH is for L1 gas and a small deposit; one request per address per hour.`
      : `Sends ${amounts} (a test token) on the local L1, where you deposit into the channel. Devnet funds only: not Sepolia ETH, and gone when the devnet restarts.`;
  });
  const say = (m, ok) => { $("out").textContent = m; $("out").className = "out " + (ok ? "ok" : "bad"); };
  $("addr").value = new URLSearchParams(location.search).get("address") ?? "";
  $("useWallet").onclick = async () => {
    if (!window.ethereum) return say("No wallet found. Install MetaMask or Rabby, or paste an address.", false);
    const [a] = await window.ethereum.request({ method: "eth_requestAccounts" });
    $("addr").value = a;
  };
  $("go").onclick = async () => {
    const address = $("addr").value.trim();
    if (!/^0x[0-9a-fA-F]{40}$/.test(address)) return say("Enter a 0x address of 40 hex characters.", false);
    $("go").disabled = true;
    say("Sending…", true);
    try {
      const r = await fetch("/api/faucet", { method: "POST", body: JSON.stringify({ address }) });
      const j = await r.json().catch(() => ({}));
      r.ok ? say(`Sent ${amounts} to ${address.slice(0, 6)}…${address.slice(-4)}.`, true) : say(j.error ?? "The faucet failed.", false);
    } finally { $("go").disabled = false; }
  };
</script>
</body>
</html>
