name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Every security check has a regression test; this gates every change.
    name: Rust (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8 (commit)
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1 (anvil for integration tests)
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Fixtures are reproducible
        run: |
          cargo run -q -p channel-types --bin gen-fixtures
          git diff --exit-code -- fixtures/

  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: Format
        working-directory: contracts
        run: forge fmt --check
      - name: Test
        working-directory: contracts
        run: forge test
      - name: Sizes (Amsterdam chains need < ~9.7 KB)
        working-directory: contracts
        run: forge build --sizes

  e2e:
    # Cross-language commitments, then Read-and-Split on two anvil chains (mock acceptance).
    name: Encodings and anvil e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8 (commit)
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 23
      - name: Build
        run: |
          cargo build -p channel-runner --locked
          (cd contracts && forge build)
      - name: Encodings (viem)
        working-directory: ts
        run: npm ci --no-audit --no-fund && npm run -s check-encodings
      - name: e2e (anvil)
        working-directory: ts
        run: npm run -s e2e
      - name: e2e app channels (anvil, mock verifier)
        working-directory: ts
        run: npm run -s e2e-app
      - name: e2e prediction rounds (anvil, optimistic, no mocks)
        working-directory: ts
        run: npm run -s e2e-predict
      - name: e2e stateful clearing (anvil L1 + local executor)
        working-directory: ts
        run: npm run -s e2e-clearing
      - name: e2e clearing v2 (optimistic, handover, forced orders)
        working-directory: ts
        run: npm run -s e2e-clearing-v2
